<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A — xterm-style portfolio</title><style>
:root{color-scheme:dark;--bg:#101419;--panel:#171d23;--line:#35414b;--fg:#d7e0e8;--muted:#8c9ba7;--green:#91d7a2;--blue:#8cc8ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}.wrap{max-width:1120px;margin:auto;padding:30px}.brand{display:flex;justify-content:space-between;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:16px}.brand strong{color:var(--fg)}h1{font:500 clamp(28px,5vw,50px)/1.1 Georgia,serif;margin:30px 0 8px}.intro{color:var(--muted);margin:0 0 22px}.shell{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);box-shadow:0 18px 50px #0005}.bar{padding:10px 14px;background:#202830;color:var(--muted);font-size:12px}.screen{height:490px;overflow:auto;padding:18px}.line{white-space:pre-wrap;overflow-wrap:anywhere}.green{color:var(--green)}.blue{color:var(--blue)}.dim{color:var(--muted)}form{display:flex;gap:10px}input{flex:1;background:none;border:0;color:var(--fg);font:inherit;outline:none;min-width:0}.project{padding:10px 0;border-bottom:1px solid #29323a}.project b{color:var(--green)}.heroimg{height:100px;margin:12px 0;background:linear-gradient(135deg,#233a4a,#475e69 38%,#19282e 39%,#273b42);border:1px solid var(--line);display:grid;place-items:center;color:#d9eee0;font:12px Georgia,serif}.screen:focus-visible{outline:2px solid var(--blue)}@media(max-width:600px){.wrap{padding:16px}.screen{height:65vh;padding:13px}.brand span:last-child{display:none}}
</style><body><div class="wrap"><div class="brand"><strong>davidaw.ad <span class="dim">/ portfolio shell</span></strong><span>00:00:00 · <a href="#" style="color:inherit">theme</a></span></div><h1>Projects, from the prompt.</h1><p class="intro">A full-screen terminal view. Try <code>help</code>, <code>ls</code>, <code>open thoth</code>, <code>cat README</code>, or <code>tree</code>.</p><div class="shell"><div class="bar">● ● ● &nbsp; david@awad — zsh — 112×34</div><div class="screen" id="screen" tabindex="0" aria-live="polite"><div id="out"></div><form id="form"><span class="green">david@awad:~$</span><input id="cmd" aria-label="Command" autofocus></form></div></div></div><script>
const data=[['thoth','2020','tool','Rust','Terminal-based note-taking with markdown preview.','github.com/DavidAwad/thoth'],['Civ Pro: The Gathering','2026','legal-tech','TypeScript','Practice federal civil procedure through an interactive case.','civ-pro-the-gathering-97ee4c.gitlab.io/drill/'],['pebbledex','2014','embedded','C','A Pokedex for the Pebble smartwatch.','github.com/DavidAwad/pebbledex']];let hist=[],i=0;const out=document.querySelector('#out'),cmd=document.querySelector('#cmd');function line(t,c=''){let d=document.createElement('div');d.className='line '+c;d.textContent=t;out.append(d)}function run(s){let [c,...a]=s.trim().split(/\s+/),q=a.join(' ').toLowerCase();if(c==='help')['help · ls · cd <section> · grep <term> · open <project> · cat README · tree · clear','Use ↑/↓ for history; Tab completes project names.'].forEach(x=>line(x,'dim'));else if(c==='ls'||c==='grep'){data.filter(p=>!q||p.join(' ').toLowerCase().includes(q)).forEach(p=>{let d=document.createElement('div');d.className='project';d.innerHTML=`<b>${p[0]}</b> <span class="dim">${p[1]} ${p[2]} · ${p[3]}</span><br>${p[4]}`;out.append(d)})}else if(c==='cd'){line('navigated to /'+(q||''),'blue')}else if(c==='open'){let p=data.find(x=>x[0].toLowerCase().includes(q));if(!p)return line('open: project not found','dim');line('THOTH(1) · Project Manual','green');line(p[4]);line('LANGUAGE   '+p[3]+'\nYEAR       '+p[1]+'\nSOURCE     '+p[5]);let img=document.createElement('div');img.className='heroimg';img.textContent='[ project preview ]';out.append(img)}else if(c==='cat'&&q==='readme')line('# '+data[0][0]+'\n\n'+data[0][4]+'\n\n## Install\nClone the repository and follow its README.');else if(c==='tree')line('projects/\n├── thoth/README.md\n├── civ-pro-the-gathering/\n└── pebbledex/');else if(c==='clear')out.replaceChildren();else line('command not found — type help','dim')}document.querySelector('#form').onsubmit=e=>{e.preventDefault();let s=cmd.value;line('david@awad:~$ '+s,'green');hist.push(s);i=hist.length;run(s);cmd.value='';document.querySelector('#screen').scrollTop=99999};cmd.onkeydown=e=>{if(e.key==='ArrowUp'){i=Math.max(0,i-1);cmd.value=hist[i]||''}if(e.key==='ArrowDown'){i=Math.min(hist.length,i+1);cmd.value=hist[i]||''}if(e.key==='Tab'){e.preventDefault();cmd.value='open '+(data.find(x=>x[0].startsWith(cmd.value.split(' ').at(-1)))?.[0]||cmd.value)}};line('Welcome to the project shell. Type help to see commands.','dim');run('ls');
</script></body></html>

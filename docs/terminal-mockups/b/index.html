<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B — document terminal</title><style>
:root{color-scheme:light dark;--bg:#f4f0e7;--paper:#fbf9f4;--ink:#252a2c;--soft:#e1ddd2;--accent:#246247;--mute:#74766e}@media(prefers-color-scheme:dark){:root{--bg:#1d2221;--paper:#242a28;--ink:#e9e9df;--soft:#3b4440;--accent:#8ec4a5;--mute:#a7aea9}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Georgia,serif}.page{max-width:900px;margin:auto;padding:38px 28px}.nav{display:flex;justify-content:space-between;border-bottom:1px solid var(--soft);padding-bottom:15px;font:13px ui-monospace,monospace;color:var(--mute)}h1{font-size:clamp(34px,6vw,58px);line-height:1.04;letter-spacing:-.04em;margin:52px 0 14px}.lede{font-size:18px;max-width:600px;color:var(--mute)}.terminal{margin-top:36px;background:var(--paper);border:1px solid var(--soft);border-radius:4px;padding:24px 28px;box-shadow:0 12px 36px #0001}.label{font:12px ui-monospace,monospace;letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}.screen{min-height:340px;margin-top:16px;font:14px/1.8 ui-monospace,monospace}.screen p{margin:4px 0}.command{color:var(--accent)}.result{padding:12px 0;border-bottom:1px solid var(--soft)}.result strong{display:block;font:600 18px Georgia,serif}.result small{color:var(--mute)}form{display:flex;gap:8px;margin-top:12px;color:var(--accent)}input{flex:1;border:0;border-bottom:1px solid var(--soft);outline:0;background:transparent;color:var(--ink);font:14px ui-monospace,monospace;min-width:0}input:focus{border-color:var(--accent)}.foot{margin-top:18px;color:var(--mute);font:12px ui-monospace,monospace}@media(max-width:600px){.page{padding:22px 17px}.terminal{padding:18px 16px}.nav span:last-child{display:none}.screen{min-height:45vh}}
</style><body><main class="page"><nav class="nav"><b>davidaw.ad</b><span>writing · projects · about</span></nav><h1>A quieter way<br>to explore.</h1><p class="lede">A hand-rolled terminal treated like a readable document. Project pages borrow from man pages; output remains ordinary selectable HTML.</p><section class="terminal" aria-label="Interactive project terminal"><div class="label">Interactive index <span style="float:right">keyboard ready</span></div><div class="screen" id="screen" aria-live="polite"></div><form id="form"><b>›</b><input id="cmd" aria-label="Command" placeholder="help, ls, open thoth…" autocomplete="off"></form><div class="foot">↑ ↓ history · Tab completion · Esc leaves input</div></section></main><script>
const data=[['thoth','2020','tool','Rust','Terminal-based note-taking with markdown preview.','github.com/DavidAwad/thoth'],['Civ Pro: The Gathering','2026','legal-tech','TypeScript','Practice federal civil procedure through an interactive case.','civ-pro-the-gathering-97ee4c.gitlab.io/drill/'],['pebbledex','2014','embedded','C','A Pokedex for the Pebble smartwatch.','github.com/DavidAwad/pebbledex']];const screen=document.querySelector('#screen'),cmd=document.querySelector('#cmd');let hist=[],i=0;function p(t,c=''){let x=document.createElement('p');x.className=c;x.textContent=t;screen.append(x)}function run(s){let[c,...a]=s.trim().split(/\s+/),q=a.join(' ').toLowerCase();if(c==='help')p('help · ls · cd <section> · grep <term> · open <project> · cat README · tree · clear');else if(c==='ls'||c==='grep'){data.filter(x=>!q||x.join(' ').toLowerCase().includes(q)).forEach(x=>{let d=document.createElement('div');d.className='result';d.innerHTML=`<strong>${x[0]}</strong><small>${x[1]} · ${x[2]} · ${x[3]}</small><br>${x[4]}`;screen.append(d)})}else if(c==='open'){let x=data.find(z=>z[0].toLowerCase().includes(q));if(!x)return p('No matching project.');p(x[0].toUpperCase()+'(1) · PROJECT REFERENCE','command');p('NAME\n    '+x[0]);p('DESCRIPTION\n    '+x[4]);p('LANGUAGE / YEAR\n    '+x[3]+' / '+x[1]);p('SOURCE\n    '+x[5])}else if(c==='cat')p('# thoth — '+data[0][4]+'\n\nInstall from source. See project repository for usage.');else if(c==='tree')p('projects/\n├── thoth/README.md\n├── civ-pro-the-gathering/\n└── pebbledex/');else if(c==='cd')p('Section: /'+q);else if(c==='clear')screen.replaceChildren();else p('Unknown command. Type help.')}document.querySelector('#form').onsubmit=e=>{e.preventDefault();let s=cmd.value; p('› '+s,'command');hist.push(s);i=hist.length;run(s);cmd.value=''};cmd.onkeydown=e=>{if(e.key==='ArrowUp'){i=Math.max(0,i-1);cmd.value=hist[i]||''}if(e.key==='ArrowDown'){i=Math.min(hist.length,i+1);cmd.value=hist[i]||''}if(e.key==='Tab'){e.preventDefault();let name=data.find(x=>x[0].startsWith(cmd.value.split(' ').at(-1)))?.[0];if(name)cmd.value=(cmd.value.includes(' ')?'open ':'')+name}};p('Type help to browse commands.','');run('ls');
</script></body></html>
